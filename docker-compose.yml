x-servicio: &servicio
  build: &build
    context: .
    target: runtime
  restart: unless-stopped
  # Sin el perfil «observabilidad» el colector no existe y el SDK descarta en silencio.
  environment: &otel { OTEL_EXPORTER_OTLP_ENDPOINT: 'http://otel-collector:4318' }
  healthcheck:
    test:
      [
        'CMD',
        'node',
        '-e',
        "fetch('http://127.0.0.1:'+process.env.PORT+'/salud').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))",
      ]
    interval: 5s
    timeout: 10s
    retries: 10

services:
  sunat-sim:
    <<: *servicio
    build: { <<: *build, args: { APP: sunat-sim } }
    image: chasqui/sunat-sim:dev
    environment:
      {
        <<: *otel,
        PORT: 7100,
        DB_RUTA: /data/sunat.sqlite,
        CHAOS_CONTROL_URL: 'http://chaos-control:7400',
      }
    volumes: ['datos-sunat:/data']
    ports: ['7100:7100']

  pagos-sim:
    <<: *servicio
    build: { <<: *build, args: { APP: pagos-sim } }
    image: chasqui/pagos-sim:dev
    environment:
      {
        <<: *otel,
        PORT: 7200,
        DB_URL: /data/pagos.sqlite,
        CHAOS_CONTROL_URL: 'http://chaos-control:7400',
      }
    volumes: ['datos-pagos:/data']
    ports: ['7200:7200']

  identidad-sim:
    <<: *servicio
    build: { <<: *build, args: { APP: identidad-sim } }
    image: chasqui/identidad-sim:dev
    environment: { <<: *otel, PORT: 7300, CHAOS_CONTROL_URL: 'http://chaos-control:7400' }
    ports: ['7300:7300']

  tienda-demo:
    <<: *servicio
    build: { <<: *build, args: { APP: tienda-demo } }
    image: chasqui/tienda-demo:dev
    environment:
      <<: *otel
      PORT: 7600
      SUNAT_URL: 'http://sunat-sim:7100'
      PAGOS_URL: 'http://pagos-sim:7200'
      IDENTIDAD_URL: 'http://identidad-sim:7300'
      CHAOS_CONTROL_URL: 'http://chaos-control:7400'
    ports: ['7600:7600']

  chaos-control:
    <<: *servicio
    build: { <<: *build, args: { APP: chaos-control } }
    image: chasqui/chaos-control:dev
    environment: { <<: *otel, PORT: 7400 }
    ports: ['7400:7400']

  panel:
    build: { context: ., target: panel }
    image: chasqui/panel:dev
    restart: unless-stopped
    depends_on:
      sunat-sim: { condition: service_healthy }
      pagos-sim: { condition: service_healthy }
      identidad-sim: { condition: service_healthy }
      chaos-control: { condition: service_healthy }
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1/sunat/salud']
      interval: 5s
      timeout: 10s
      retries: 10
    ports: ['7500:80']

  # ── Observabilidad: docker compose --profile observabilidad up -d ──
  otel-collector:
    profiles: [observabilidad]
    image: otel/opentelemetry-collector-contrib:0.115.1
    command: ['--config=/etc/otelcol/config.yaml']
    volumes: ['./infra/otel-collector.yaml:/etc/otelcol/config.yaml:ro']
    ports: ['4318:4318']
    depends_on: [jaeger]

  jaeger:
    profiles: [observabilidad]
    image: jaegertracing/all-in-one:1.64.0
    ports: ['16686:16686']

  prometheus:
    profiles: [observabilidad]
    image: prom/prometheus:v3.0.1
    volumes: ['./infra/prometheus.yml:/etc/prometheus/prometheus.yml:ro']
    ports: ['9090:9090']
    depends_on: [otel-collector]

  grafana:
    profiles: [observabilidad]
    image: grafana/grafana:11.4.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: 'true'
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/chasqui.json
    volumes:
      - './infra/grafana/provisioning:/etc/grafana/provisioning:ro'
      - './infra/grafana/dashboards:/var/lib/grafana/dashboards:ro'
    ports: ['3000:3000']
    depends_on: [prometheus, jaeger]
volumes:
  datos-sunat:
  datos-pagos:
