x-servicio: &servicio
  build: &build
    context: .
    target: runtime
  restart: unless-stopped
  healthcheck:
    test:
      [
        'CMD',
        'node',
        '-e',
        "fetch('http://127.0.0.1:'+process.env.PORT+'/salud').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))",
      ]
    interval: 5s
    timeout: 3s
    retries: 10

services:
  sunat-sim:
    <<: *servicio
    build: { <<: *build, args: { APP: sunat-sim } }
    image: chasqui/sunat-sim:dev
    environment: { PORT: 7100 }
    ports: ['7100:7100']
