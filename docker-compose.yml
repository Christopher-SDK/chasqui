x-servicio: &servicio
  build: &build
    context: .
    target: runtime
  restart: unless-stopped
  healthcheck:
    test:
      [
        'CMD',
        'node',
        '-e',
        "fetch('http://127.0.0.1:'+process.env.PORT+'/salud').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))",
      ]
    interval: 5s
    timeout: 10s
    retries: 10

services:
  sunat-sim:
    <<: *servicio
    build: { <<: *build, args: { APP: sunat-sim } }
    image: chasqui/sunat-sim:dev
    environment:
      { PORT: 7100, DB_RUTA: /data/sunat.sqlite, CHAOS_CONTROL_URL: 'http://chaos-control:7400' }
    volumes: ['datos-sunat:/data']
    ports: ['7100:7100']

  pagos-sim:
    <<: *servicio
    build: { <<: *build, args: { APP: pagos-sim } }
    image: chasqui/pagos-sim:dev
    environment:
      { PORT: 7200, DB_URL: /data/pagos.sqlite, CHAOS_CONTROL_URL: 'http://chaos-control:7400' }
    volumes: ['datos-pagos:/data']
    ports: ['7200:7200']

  identidad-sim:
    <<: *servicio
    build: { <<: *build, args: { APP: identidad-sim } }
    image: chasqui/identidad-sim:dev
    environment: { PORT: 7300, CHAOS_CONTROL_URL: 'http://chaos-control:7400' }
    ports: ['7300:7300']

  tienda-demo:
    <<: *servicio
    build: { <<: *build, args: { APP: tienda-demo } }
    image: chasqui/tienda-demo:dev
    environment:
      PORT: 7600
      SUNAT_URL: 'http://sunat-sim:7100'
      PAGOS_URL: 'http://pagos-sim:7200'
      IDENTIDAD_URL: 'http://identidad-sim:7300'
      CHAOS_CONTROL_URL: 'http://chaos-control:7400'
    ports: ['7600:7600']

  chaos-control:
    <<: *servicio
    build: { <<: *build, args: { APP: chaos-control } }
    image: chasqui/chaos-control:dev
    environment: { PORT: 7400 }
    ports: ['7400:7400']

  panel:
    build: { context: ., target: panel }
    image: chasqui/panel:dev
    restart: unless-stopped
    depends_on:
      sunat-sim: { condition: service_healthy }
      pagos-sim: { condition: service_healthy }
      identidad-sim: { condition: service_healthy }
      chaos-control: { condition: service_healthy }
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1/sunat/salud']
      interval: 5s
      timeout: 10s
      retries: 10
    ports: ['7500:80']

volumes:
  datos-sunat:
  datos-pagos:
