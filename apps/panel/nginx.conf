server {
  listen 80;
  root /usr/share/nginx/html;

  # Proxy hacia sunat-sim (REST, SOAP y eventos en vivo).
  location /sunat/ {
    proxy_pass http://sunat-sim:7100/;
    proxy_http_version 1.1;
    proxy_set_header Connection '';
    # SSE: sin buffer ni tiempo límite, para que cada evento llegue al instante.
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 1h;
  }

  # Proxy hacia pagos-sim (con su flujo SSE).
  location /pagos/ {
    proxy_pass http://pagos-sim:7200/;
    proxy_http_version 1.1;
    proxy_set_header Connection '';
    proxy_buffering off;
    proxy_read_timeout 1h;
  }

  location /identidad/ {
    proxy_pass http://identidad-sim:7300/;
  }

  # Proxy hacia chaos-control (perfiles y estado del caos).
  location /caos/ {
    proxy_pass http://chaos-control:7400/;
  }

  location / {
    try_files $uri /index.html;
  }
}
