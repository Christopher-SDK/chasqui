server {
  listen 80;
  root /usr/share/nginx/html;

  # DNS de Docker con TTL corto: si un servicio se recrea y cambia de IP, el proxy lo sigue
  # encontrando (con proxy_pass fijo, nginx resuelve una sola vez al arrancar y da 502).
  resolver 127.0.0.11 valid=10s ipv6=off;

  # Proxy hacia sunat-sim (REST, SOAP y eventos en vivo).
  location /sunat/ {
    set $destino sunat-sim:7100;
    rewrite ^/sunat/(.*)$ /$1 break;
    proxy_pass http://$destino;
    proxy_http_version 1.1;
    proxy_set_header Connection '';
    # SSE: sin buffer ni tiempo límite, para que cada evento llegue al instante.
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 1h;
  }

  # Proxy hacia pagos-sim (con su flujo SSE).
  location /pagos/ {
    set $destino pagos-sim:7200;
    rewrite ^/pagos/(.*)$ /$1 break;
    proxy_pass http://$destino;
    proxy_http_version 1.1;
    proxy_set_header Connection '';
    proxy_buffering off;
    proxy_read_timeout 1h;
  }

  location /identidad/ {
    set $destino identidad-sim:7300;
    rewrite ^/identidad/(.*)$ /$1 break;
    proxy_pass http://$destino;
  }

  # Proxy hacia chaos-control (perfiles y estado del caos).
  location /caos/ {
    set $destino chaos-control:7400;
    rewrite ^/caos/(.*)$ /$1 break;
    proxy_pass http://$destino;
  }

  location / {
    try_files $uri /index.html;
  }
}
